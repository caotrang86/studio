<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập | CaoTrangAI</title>
  <link rel="stylesheet" href="/_next/static/chunks/0u86oo_rl9-1.css">
  <link rel="stylesheet" href="/_next/static/chunks/0ej2iye1u9t1_.css">
  <link rel="shortcut icon" href="/logo.png">
  <link rel="icon" href="/logo.png">
  <style>
    body { margin: 0; font-family: Inter, system-ui, -apple-system, sans-serif; }
    .login-bg {
      min-height: 100vh;
      display: flex;
      background: #0C1117;
      color: #e2e8f0;
    }
    .login-showcase {
      display: none;
      width: 55%;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #0f1923 0%, #0C1117 100%);
    }
    @media (min-width: 1024px) { .login-showcase { display: flex; } }
    .login-showcase::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, transparent 60%, #0C1117);
      z-index: 1;
    }
    .showcase-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 24px;
      width: 100%;
    }
    .showcase-grid img {
      width: 100%;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.05);
      object-fit: cover;
    }
    .login-form-side {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
    }
    .login-card h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .login-card .subtitle {
      color: #94a3b8;
      margin-bottom: 32px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: #1a1f2e;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }
    .form-group input:focus {
      border-color: #22d3ee;
    }
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #06b6d4, #0ea5e9);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .error-msg {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
      display: none;
    }
    .switch-link {
      text-align: center;
      margin-top: 24px;
      color: #94a3b8;
      font-size: 14px;
    }
    .switch-link a { color: #22d3ee; text-decoration: none; }
    .switch-link a:hover { text-decoration: underline; }
    .logo-link {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 40px;
      text-decoration: none;
      color: #fff;
    }
    .logo-link img { width: 36px; height: 36px; }
    .logo-link span { font-size: 20px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="login-bg">
    <div class="login-showcase">
      <div class="showcase-grid">
        <img src="/cdn/tools/covers/chuyen-anh-ghibli-after.png" alt="" loading="lazy">
        <img src="/cdn/tools/covers/xoa-nen-anh.png" alt="" loading="lazy">
        <img src="/cdn/tools/covers/nang-cap-4k-after.png" alt="" loading="lazy">
        <img src="/cdn/tools/covers/anh-chan-dung.png" alt="" loading="lazy">
        <img src="/cdn/tools/covers/thay-do-ai.png" alt="" loading="lazy">
        <img src="/cdn/tools/covers/doi-background.png" alt="" loading="lazy">
      </div>
    </div>

    <div class="login-form-side">
      <div class="login-card">
        <a href="/" class="logo-link">
          <img src="/icon.png" alt="Logo">
          <span>CaoTrangAI</span>
        </a>

        <h1>Đăng nhập</h1>
        <p class="subtitle">Chào mừng bạn trở lại! Đăng nhập để tiếp tục sáng tạo.</p>

        <div id="error-msg" class="error-msg"></div>

        <form id="login-form" autocomplete="on">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required autofocus>
          </div>
          <div class="form-group">
            <label for="password">Mật khẩu</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required minlength="6">
          </div>
          <button type="submit" class="btn-primary" id="submit-btn">Đăng nhập</button>
        </form>

        <div class="switch-link">
          Chưa có tài khoản? <a href="/register">Đăng ký miễn phí</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    var form = document.getElementById('login-form');
    var errorEl = document.getElementById('error-msg');
    var submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      errorEl.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Đang đăng nhập...';

      var email = document.getElementById('email').value;
      var password = document.getElementById('password').value;

      fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ email: email, password: password }),
      })
        .then(function (r) { return r.json().then(function (d) { return { status: r.status, data: d }; }); })
        .then(function (r) {
          if (r.status === 200) {
            localStorage.setItem('studio_token', r.data.token);
            window.location.href = r.data.user.role === 'admin' ? '/admin' : '/apps';
          } else {
            errorEl.textContent = r.data.error || 'Đăng nhập thất bại';
            errorEl.style.display = 'block';
          }
        })
        .catch(function () {
          errorEl.textContent = 'Lỗi kết nối server';
          errorEl.style.display = 'block';
        })
        .finally(function () {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Đăng nhập';
        });
    });
  </script>
</body>
</html>
